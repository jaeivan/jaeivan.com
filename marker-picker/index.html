<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Marker Picker · random marker color picker</title>
        <link rel="icon" href="favicon.gif" type="image/gif">
        <link rel="apple-touch-icon" href="icon.png">
        <meta name="description" content="Pick four random marker colors, or warm, cool or neutral ones. Lock the ones you like and reroll the rest.">
        <link rel="canonical" href="https://jaeivan.com/marker-picker/">
        <!-- Link previews need full URLs (crawlers don't resolve relative paths) -->
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="jaeivan">
        <meta property="og:url" content="https://jaeivan.com/marker-picker/">
        <meta property="og:title" content="Marker Picker">
        <meta property="og:description" content="Pick four random marker colors, or warm, cool or neutral ones. Lock the ones you like and reroll the rest.">
        <meta property="og:image" content="https://jaeivan.com/marker-picker/icon.png">
        <meta property="og:image:width" content="180">
        <meta property="og:image:height" content="180">
        <meta name="twitter:card" content="summary">
        <link rel="stylesheet" href="../shared/theme.css">
        <link rel="stylesheet" href="../shared/hub-nav.css">
        <link rel="stylesheet" href="styles.css">
        <script src="../shared/theme.js"></script>
    </head>
    <body>
        <a class="hub-nav" href="../">← All apps</a>
        <div class="app">
            <header><h1><img class="title-marker" src="marker.gif" alt="">Marker Picker</h1></header>
            <div class="toolbar">
                <select id="mode">
                    <option>Random</option>
                    <option>Warm</option>
                    <option>Cool</option>
                    <option>Neutral</option>
                </select>
                <button id="pickBtn">Pick 4</button>
                <button id="resetBtn">Reset</button>
            </div>
            <div class="chosen-section">
                <h2>Selected Colors</h2>
                <div id="chosenGrid"></div>
            </div>
            <p>Click markers to lock them.</p>
            <div id="grid"></div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
